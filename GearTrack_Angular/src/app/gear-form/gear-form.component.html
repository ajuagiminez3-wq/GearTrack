<div class="mb-3"><a routerLink="/gear" class="text-decoration-none">← Back to equipment</a></div>
<div class="mb-4"><h2 class="headline">{{editing?'Edit equipment':'Add equipment'}}</h2><p class="muted mb-0">{{editing?'Save changes to your existing item.':'Create a new item in the MySQL inventory.'}}</p></div>
<div *ngIf="loading" class="alert alert-info">Loading equipment form…</div>
<div *ngIf="error" class="alert alert-danger" role="alert">{{error}}</div>
<form *ngIf="!loading" #gearForm="ngForm" (ngSubmit)="save()" class="shadow-card p-4 p-lg-5">
 <div class="row g-3">
  <div class="col-md-6"><label class="form-label" for="name">Equipment name *</label><input id="name" class="form-control" name="name" [(ngModel)]="form.name" required maxlength="120" placeholder="Sony A7S III"></div>
  <div class="col-md-6"><label class="form-label" for="brand">Brand *</label><input id="brand" class="form-control" name="brand" [(ngModel)]="form.brand" required maxlength="80" placeholder="Sony"></div>
  <div class="col-md-6"><label class="form-label" for="category">Category *</label><select id="category" class="form-select" name="categoryId" [(ngModel)]="form.categoryId" required><option *ngFor="let category of categories" [ngValue]="category.id">{{category.name}}</option></select></div>
  <div class="col-md-6"><label class="form-label" for="price">Purchase price ($) *</label><input id="price" class="form-control" type="number" min="0" step="0.01" name="purchasePrice" [(ngModel)]="form.purchasePrice" required></div>
  <div class="col-md-6"><label class="form-label" for="date">Purchase date</label><input id="date" class="form-control" type="date" name="date" [(ngModel)]="dateText"><div class="field-hint">Optional</div></div>
  <div class="col-md-6"><label class="form-label" for="status">Availability</label><select id="status" class="form-select" name="isAvailable" [(ngModel)]="form.isAvailable"><option [ngValue]="true">Available</option><option [ngValue]="false">In use</option></select></div>
  <div class="col-12"><label class="form-label" for="notes">Notes</label><textarea id="notes" class="form-control" rows="4" name="notes" maxlength="5000" [(ngModel)]="notesText" placeholder="Condition, serial number, or other notes"></textarea></div>
 </div>
 <div class="d-flex gap-2 mt-4 flex-wrap"><button type="submit" class="btn btn-primary" [disabled]="gearForm.invalid||saving">{{saving?'Saving…':editing?'Save changes':'Create equipment'}}</button><a routerLink="/gear" class="btn btn-outline-secondary">Cancel</a></div>
</form>
